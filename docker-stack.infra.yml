version: '3.8'

# =============================================================================
# Shared Infrastructure Stack - Traefik, Portainer, Dozzle
# =============================================================================
#
# Deploy: docker stack deploy -c docker-stack.infra.yml infra
#
# This stack provides:
# - Shared Traefik reverse proxy (handles TLS for all app stacks)
# - Portainer (Docker Swarm management UI)
# - Dozzle (log viewer for all containers)
#
# SECURITY NOTES:
# - Portainer (9000) and Dozzle (8888) are localhost-only via iptables
# - Traefik dashboard (8081) is localhost-only via iptables
#
# To restrict access, run:
#   # Allow localhost
#   sudo iptables -I DOCKER-USER -i lo -p tcp --dport 9000 -j ACCEPT
#   sudo iptables -I DOCKER-USER -i lo -p tcp --dport 8888 -j ACCEPT
#   sudo iptables -I DOCKER-USER -i lo -p tcp --dport 8081 -j ACCEPT
#   # Drop external
#   sudo iptables -I DOCKER-USER -p tcp --dport 9000 -j DROP
#   sudo iptables -I DOCKER-USER -p tcp --dport 8888 -j DROP
#   sudo iptables -I DOCKER-USER -p tcp --dport 8081 -j DROP
#
# To access via SSH tunnel:
#   ssh -L 9000:127.0.0.1:9000 -L 8888:127.0.0.1:8888 -L 8081:127.0.0.1:8081 user@vps-ip
# =============================================================================

services:
  traefik:
    image: traefik:v2.11
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.swarmMode=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=traefik_public
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=admin@kobuai.eu
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --ping=true
      - --log.level=INFO
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
      - target: 8081
        published: 8081
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    networks:
      - traefik_public
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.http.routers.traefik.rule=Host(`traefik.my.kobuai.eu`)
        - traefik.http.routers.traefik.service=api@internal
        - traefik.http.routers.traefik.tls.certresolver=letsencrypt
        - traefik.http.services.traefik.loadbalancer.server.port=8080
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  portainer:
    image: portainer/portainer-ce:latest
    command: -H unix:///var/run/docker.sock
    ports:
      - target: 9000
        published: 9000
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    networks:
      - traefik_public
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
      restart_policy:
        condition: on-failure
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  dozzle:
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:8888:8080"  # Only localhost access (for SSH tunnel)
    environment:
      DOZZLE_LEVEL: info
      DOZZLE_TAILSIZE: 300
      # No filter - monitors ALL containers across all stacks
      DOZZLE_NO_ANALYTICS: "true"
    networks:
      - traefik_public
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
      restart_policy:
        condition: on-failure
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

networks:
  traefik_public:
    driver: overlay
    attachable: true
    driver_opts:
      encrypted: "true"

volumes:
  traefik_certs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/data/traefik
  portainer_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/data/portainer
